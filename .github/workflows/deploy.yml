name: Deploy React App to GitHub Pages

on:
  push:
    branches: ["main"] # Change to "master" if your default branch is named master
    paths:
      - 'Practice_Project/frontend/**' # Triggers only when changes occur in frontend

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # Tell GitHub Actions to execute commands inside Practice_Project/frontend
    defaults:
      run:
        working-directory: ./Practice_Project/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './Practice_Project/frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build React App
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './Practice_Project/frontend/dist' # Use './Practice_Project/frontend/build' if using Create React App

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4