services:
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8080
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3

  api1: &api
    build: ./backend
    environment:
      - MONGO_URL=mongodb://mongo:27017/mernapp
      - INSTANCE_ID=api1
    depends_on:
      - mongo

  api2:
    <<: *api
    environment:
      - MONGO_URL=mongodb://mongo:27017/mernapp
      - INSTANCE_ID=api2

  api3:
    <<: *api
    environment:
      - MONGO_URL=mongodb://mongo:27017/mernapp
      - INSTANCE_ID=api3

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: